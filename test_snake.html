<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>贪吃蛇测试</title>
    <style>
        body { 
            background: #000; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            font-family: sans-serif;
            color: white;
        }
        canvas { 
            border: 2px solid #0f0; 
            background: #222;
        }
        button {
            margin: 10px;
            padding: 15px 30px;
            font-size: 18px;
            background: #0f0;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        #msg { margin: 10px; }
    </style>
</head>
<body>
    <h1>🐍 贪吃蛇测试</h1>
    <canvas id="c" width="300" height="300"></canvas>
    <div id="msg">点击按钮开始</div>
    <button onclick="startGame()">开始游戏</button>
    
    <script>
        const canvas = document.getElementById('c');
        const ctx = canvas.getContext('2d');
        const msg = document.getElementById('msg');
        
        let snake = [
            {x: 5, y: 10},
            {x: 4, y: 10},
            {x: 3, y: 10}
        ];
        let direction = {x: 1, y: 0};
        let food = {x: 10, y: 10};
        let gameRunning = false;
        let gameLoop = null;
        
        function draw() {
            // 画背景
            ctx.fillStyle = '#222';
            ctx.fillRect(0, 0, 300, 300);
            
            // 画蛇 - 绿色方块
            ctx.fillStyle = '#0f0';
            for (let i = 0; i < snake.length; i++) {
                const s = snake[i];
                ctx.fillRect(s.x * 15 + 1, s.y * 15 + 1, 13, 13);
            }
            
            // 画食物 - 红色
            ctx.fillStyle = '#f00';
            ctx.beginPath();
            ctx.arc(food.x * 15 + 7.5, food.y * 15 + 7.5, 6, 0, Math.PI * 2);
            ctx.fill();
            
            msg.innerText = '蛇长度: ' + snake.length + ', 食物: (' + food.x + ',' + food.y + ')';
        }
        
        function update() {
            if (!gameRunning) return;
            
            // 移动蛇
            const head = {x: snake[0].x + direction.x, y: snake[0].y + direction.y};
            
            // 撞墙 - 穿墙
            if (head.x < 0) head.x = 19;
            if (head.x >= 20) head.x = 0;
            if (head.y < 0) head.y = 19;
            if (head.y >= 20) head.y = 0;
            
            // 撞自己
            for (let s of snake) {
                if (head.x === s.x && head.y === s.y) {
                    gameRunning = false;
                    clearInterval(gameLoop);
                    msg.innerText = '游戏结束! 得分: ' + (snake.length - 3) * 10;
                    return;
                }
            }
            
            snake.unshift(head);
            
            // 吃食物
            if (head.x === food.x && head.y === food.y) {
                food = {
                    x: Math.floor(Math.random() * 20),
                    y: Math.floor(Math.random() * 20)
                };
            } else {
                snake.pop();
            }
            
            draw();
        }
        
        function startGame() {
            snake = [
                {x: 5, y: 10},
                {x: 4, y: 10},
                {x: 3, y: 10}
            ];
            direction = {x: 1, y: 0};
            food = {x: 10, y: 10};
            gameRunning = true;
            msg.innerText = '游戏中...';
            draw();
            
            if (gameLoop) clearInterval(gameLoop);
            gameLoop = setInterval(update, 300);
        }
        
        // 键盘控制
        document.addEventListener('keydown', e => {
            if (e.key === 'ArrowUp' && direction.y !== 1) direction = {x: 0, y: -1};
            if (e.key === 'ArrowDown' && direction.y !== -1) direction = {x: 0, y: 1};
            if (e.key === 'ArrowLeft' && direction.x !== 1) direction = {x: -1, y: 0};
            if (e.key === 'ArrowRight' && direction.x !== -1) direction = {x: 1, y: 0};
        });
        
        // 初始画一次
        draw();
    </script>
</body>
</html>
